{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm mb-4"><div class="card-body">
  <h4>Жаңа сканерлеу</h4>
  <p class="text-muted">OWASP Top 10 бойынша автоматты тексеру, есеп және түзету ұсыныстары.</p>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <form method="post" action="/scan">
    <input class="form-control mb-3" name="url" placeholder="http://localhost:8080" required>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="authorized" id="a">
      <label class="form-check-label" for="a">Бұл сайтты сканерлеуге рұқсатым бар (өз жүйем немесе жазбаша келісім).</label>
    </div>
    <button class="btn btn-primary">Сканерлеуді бастау</button>
  </form>
</div></div>
<h5>Соңғы сканерлеулер</h5>
{% include "_table.html" %}
{% endblock %}
